; PlatformIO Project Configuration File — LilyGO T-Dongle-S3 (unofficial Bruce port)
;
; Pins confirmed from TWO independent sources:
;   - ESPHome community config: devices.esphome.io/devices/lilygo-tdongle-s3
;   - cpierce/lilygo-t-dongle-s3-wifi-ble (cites LilyGO's own repo pinout)
;
; NOT YET BUILD-TESTED. Flagged lines below are best-effort / need verification
; on first compile + first boot.

[env:TDONGLE-S3]
board = esp32-s3-devkitc-1
board_build.variant = TDONGLE-S3
; VERIFY: T-Dongle-S3 = 16MB flash, NO PSRAM. Confirm this partition csv exists
; in the repo and is sized for a no-PSRAM 16MB device. If missing, copy/adapt
; an existing 16MB-flash/no-PSRAM esp32-s3 board's partition table.
board_build.partitions = default_16MB.csv
board_build.f_flash = 80000000L
monitor_speed = 115200
build_src_filter = ${env.build_src_filter} +<../boards/TDONGLE-S3>
build_flags =
	${env.build_flags}
	-Iboards/TDONGLE-S3

	; ==================== Framework Control Flags ====================
	; ESP32-S3 native USB (the board's only USB port, also used for Serial)
	-DARDUINO_USB_CDC_ON_BOOT=1

	; ==================== Feature gates ====================
	; No touch, no mic, no RTC, no battery/PMIC on this board.
	-DHAS_1_BUTTON=1   ; custom marker consumed only by our own interface.cpp, not core

	; ==================== Library Flags ====================
	; TFT_eSPI Setup — ST7735 160x80 (0.96"), SPI pins confirmed (see header above)
	-D USE_TFT_ESPI=1
	-DUSER_SETUP_LOADED=1
	-DST7735_DRIVER=1
	; UNVERIFIED: this is the common tab/offset define for 160x80 ST7735 panels.
	; If the image is offset, mirrored, or wrong colors on first boot, try
	; ST7735_GREENTAB2, ST7735_REDTAB160x80 or ST7735_INITB instead.
	-DST7735_GREENTAB160x80=1
	-DTFT_RGB_ORDER=TFT_BGR    ; ESPHome config: use_bgr: true
	-DTFT_INVERSION_ON=1       ; ESPHome config: invert_colors: true
	-DTFT_WIDTH=80
	-DTFT_HEIGHT=160
	-DTFT_MOSI=3
	-DTFT_SCLK=5
	-DTFT_CS=4
	-DTFT_DC=2
	-DTFT_RST=1
	-DTFT_BL=38
	-DTFT_BACKLIGHT_ON=LOW     ; confirmed active-LOW backlight, two sources agree
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=27000000
	-DSPI_READ_FREQUENCY=20000000

	; ==================== Environment Flags ====================
	-DBTN_ALIAS='"Btn"'
	; Screen rotation — adjust 0..3 after first boot depending on which way
	; the image reads relative to the USB-A plug.
	-DROTATION=1

	-DDEVICE_NAME='"TDONGLE-S3"'

	; ---- Known NOT wired in this first pass (see interface.cpp TODOs) ----
	; SD card: ESP32-S3 SDMMC peripheral (4-bit), not a generic SPI bus like
	;   bruceConfigPins.SDCARD_bus expects. Pins for reference:
	;   CLK=12 CMD=16 D0=14 D1=17 D2=21 D3=18
	; RGB status LED: APA102 (clock + data), CLK=39 DIN=40 — needs a 2-wire
	;   clocked driver (e.g. FastLED APA102), not the single-wire WS2812
	;   pattern Bruce normally expects.

lib_deps =
	${env.lib_deps}

[env:LAUNCHER_TDONGLE-S3]
extends = env:TDONGLE-S3
build_flags =
	${env:TDONGLE-S3.build_flags}
	${env_light.build_flags}
lib_deps =
	${env_light.lib_deps}
